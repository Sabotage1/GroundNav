name: Build and publish Android update

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      server_url:
        description: Optional default Mac server URL for fresh installs
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: groundnav-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ github.sha }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Android releases must be dispatched from main" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run application checks
        run: |
          npm test
          npm run lint

      - name: Calculate the next Android version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          latest_tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n 1)"
          current_version="${latest_tag#v}"
          if [[ -z "$current_version" ]]; then
            current_version="$(node -p "require('./package.json').version")"
          fi
          IFS='.' read -r major minor patch <<< "$current_version"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "Invalid source version: $current_version" >&2
            exit 1
          fi
          case "$BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "Unsupported version increment: $BUMP" >&2; exit 1 ;;
          esac
          if (( minor >= 1000 || patch >= 1000 )); then
            echo "Minor and patch versions must remain below 1000" >&2
            exit 1
          fi
          next_version="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code <= 2 || version_code >= 2100000000 )); then
            echo "Calculated Android version code is outside the valid update range" >&2
            exit 1
          fi
          if git rev-parse "v$next_version" >/dev/null 2>&1; then
            echo "Tag v$next_version already exists" >&2
            exit 1
          fi
          echo "name=$next_version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

      - name: Build the web application
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
          VITE_GROUNDNAV_SERVER: ${{ inputs.server_url }}
        run: npm run build

      - name: Sync the Capacitor Android project
        run: npx cap sync android

      - name: Restore the Android release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/groundnav-release.jks"

      - name: Build the signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/groundnav-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GROUNDNAV_VERSION_CODE: ${{ steps.version.outputs.code }}
          GROUNDNAV_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and package release files
        id: files
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          mkdir -p release
          apk="release/GroundNav-v${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk" > release/signature.txt
          actual_cert="$(sed -n 's/.*certificate SHA-256 digest: *//p' release/signature.txt | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$expected_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "APK signing certificate $actual_cert does not match configured certificate $expected_cert" >&2
            exit 1
          fi
          echo "Verified signing certificate: $actual_cert"
          checksum="$(sha256sum "$apk" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$(basename "$apk")" > "$apk.sha256"
          cat > release/release-manifest.json <<EOF
          {
            "applicationId": "com.groundnav.llbg",
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "tag": "${{ steps.version.outputs.tag }}",
            "apk": "$(basename "$apk")",
            "sha256": "$checksum",
            "signingCertificateSha256": "$actual_cert",
            "sourceCommit": "$GITHUB_SHA"
          }
          EOF

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groundnav-android-release
          path: |
            release/GroundNav-*.apk
            release/GroundNav-*.apk.sha256
            release/release-manifest.json
            release/signature.txt
          retention-days: 5
          if-no-files-found: error

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/groundnav-release.jks"

  publish:
    name: Publish private GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: groundnav-android-release
          path: release

      - name: Recheck the downloaded APK
        working-directory: release
        run: sha256sum --check GroundNav-*.apk.sha256

      - name: Publish the release and Android update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ needs.build.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ needs.build.outputs.tag }} already exists" >&2
            exit 1
          fi
          gh release create "${{ needs.build.outputs.tag }}" \
            release/GroundNav-*.apk \
            release/GroundNav-*.apk.sha256 \
            release/release-manifest.json \
            release/signature.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.build.outputs.source_sha }}" \
            --title "GroundNav ${{ needs.build.outputs.tag }}" \
            --generate-notes \
            --draft
          gh release edit "${{ needs.build.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Write release summary
        shell: bash
        run: |
          echo "## GroundNav Android update published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ needs.build.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version code: ${{ needs.build.outputs.version_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
